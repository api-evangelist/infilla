aid: infilla
name: Infilla
description: Infilla is a permitting software platform that modernizes housing approvals for cities
  and municipal planning departments. Its product suite—a fee Calculator, a guided Application Form
  for permit intake, and digital Plan Check checklists—cuts response times, eliminates repetitive
  administrative work, and accelerates housing production. Founded and led by CEO Jenny Song after
  research with 300+ planners across 50+ jurisdictions, Infilla targets permitting as a major barrier
  to housing development by equipping government staff to work faster and better serve their communities.
  No public API, developer portal, SDK, or machine-readable specification is published at this time.
